<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana Byte</title>
    <meta name="description" content="Banana Byte — official website." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f0f12;
        --text: #f5f5f7;
        --accent: #f5c518;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 0.75rem;
        opacity: 0.7;
        max-width: 28rem;
      }
      .accent {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="accent">Banana</span> Byte</h1>
      <p>Website coming soon.</p>
    </main>
  </body>
</html>
