name = "bananabytewebsite"
main = "./worker/index.js"
compatibility_date = "2026-05-29"

# Static Astro site (output: 'static') served via Cloudflare Workers static assets.
# `npm run build` emits to ./dist. With run_worker_first scoped to /api/*, the
# Worker script (./worker/index.js) ONLY handles /api/* requests; every other
# request is served straight from ./dist — fast, free, and uncounted.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [ "/api/*" ]

# --- Non-secret config (safe to commit) ---
[vars]
ALLOWED_ORIGIN = "https://bananabyte.io"
MAIL_FROM = "BananaByte <contact@bananabyte.io>"   # must be on the Resend-verified domain
MAIL_TO = "contact@bananabyte.io, gabpar49@gmail.com"  # business inbox + personal

# --- Native rate limiting (GA): 5 submissions / 60s per client IP ---
[[ratelimits]]
name = "CONTACT_LIMITER"        # -> env.CONTACT_LIMITER
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Event-beacon rate limit (first-party analytics): 40 events / 60s per IP.
[[ratelimits]]
name = "EVENT_LIMITER"          # -> env.EVENT_LIMITER
namespace_id = "1002"
simple = { limit = 40, period = 60 }

# --- First-party click-analytics counters (cookieless) ---
[[kv_namespaces]]
binding = "EVENTS"
id = "39e64e39242d48659d5b7967cccbde56"

# --- Secrets (set once via CLI, NEVER committed) ---
#   npx wrangler secret put RESEND_API_KEY      # re_... from resend.com
#   npx wrangler secret put TELEGRAM_BOT_TOKEN  # bot token for instant pings
#   npx wrangler secret put TELEGRAM_CHAT_ID    # owner chat id (kept out of git)
#   npx wrangler secret put TURNSTILE_SECRET    # Turnstile siteverify secret
#   npx wrangler secret put STATS_TOKEN         # private key to view /api/stats
#   npx wrangler secret put OPENROUTER_API_KEY  # sk-or-... for the /api/chat AI front desk
# For `wrangler dev`, put the same names in a gitignored .dev.vars file.
